name: Windows PowerShell 5.1 startup validation
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - infra/SELECCIONAR_JAVA.ps1
      - infra/COMPROBAR_DOCKER.ps1
      - infra/INICIAR_TODO.ps1
      - infra/INICIAR_INFRA.ps1
      - infra/INICIAR_SERVICIO.ps1
      - infra/CREAR_CUENTAS_KEYCLOAK.ps1
      - .github/workflows/windows-powershell-ci.yml
  workflow_dispatch:

jobs:
  script-parse:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - name: Parse scripts using Windows PowerShell 5.1
        shell: powershell
        run: |
          $names = @(
            'infra\SELECCIONAR_JAVA.ps1',
            'infra\COMPROBAR_DOCKER.ps1',
            'infra\INICIAR_TODO.ps1',
            'infra\INICIAR_INFRA.ps1',
            'infra\INICIAR_SERVICIO.ps1',
            'infra\CREAR_CUENTAS_KEYCLOAK.ps1'
          )
          foreach ($path in $names) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "Invalid PowerShell script: $path"
            }
            Write-Host "$path : syntactically valid"
          }
      - name: Accept Java 24 without changing the computer-wide JAVA_HOME
        shell: powershell
        run: |
          $before = [Environment]::GetEnvironmentVariable('JAVA_HOME','Machine')
          . .\infra\SELECCIONAR_JAVA.ps1
          $active = & java --version | Select-Object -First 1
          Write-Host "Selected JDK: $active"
          if ($active -notmatch '^(?:java|openjdk)\s+21|^(?:java|openjdk)\s+24') {
            throw "Unexpected Java version: $active"
          }
          $compiler = & javac --version
          if($compiler -notmatch 'javac (21|24)') {
            throw "Compiler not aligned with Java executable: $compiler"
          }
          $after = [Environment]::GetEnvironmentVariable('JAVA_HOME','Machine')
          if ($before -ne $after) {
            throw 'Unexpected machine-wide JAVA_HOME change.'
          }
