name: Matriculas REST Adapter CI
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - integrations/matricula-api/**
      - .github/workflows/matriculas-adapter-ci.yml
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clonar servicio Matricula original
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Matricula-Publico_1E.git matricula
      - name: Aplicar solo adaptador temporal para verificar compilación
        run: |
          mkdir -p matricula/src/main/java/com/example/Matricula_Pedidos/integration/web
          cp integrations/matricula-api/*.java matricula/src/main/java/com/example/Matricula_Pedidos/integration/web/
      - name: Compilar sin alterar el repositorio original
        run: |
          cd matricula
          chmod +x mvnw
          ./mvnw -B -DskipTests package
