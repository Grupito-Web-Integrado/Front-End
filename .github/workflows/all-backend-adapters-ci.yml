name: Validar integración local de microservicios
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - integrations/**
      - infra/PREPARAR_BACKENDS.ps1
      - .github/workflows/all-backend-adapters-ci.yml
  workflow_dispatch:

jobs:
  catalogo-con-seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clonar fuente original de Catálogo
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Catalogo-Cursos-Publico-1A.git catalogo
      - name: Aplicar Outbox, mapeo y JWT en clon desechable
        run: |
          cp integrations/catalogo-outbox/V3__fix_outbox_and_modalities.sql catalogo/src/main/resources/db/migration/
          cp integrations/catalogo-outbox/SpringDataOutboxRepository.java catalogo/src/main/java/com/example/Catalogo_Cursos/infrastructure/input/rest/repository/
          cp integrations/catalogo-outbox/OutboxEventPublisherImpl.java integrations/catalogo-outbox/OutboxKafkaConfig.java catalogo/src/main/java/com/example/Catalogo_Cursos/infrastructure/input/rest/outbox/publisher/
          cp integrations/catalogo-outbox/CourseElasticsearchRepositoryImpl.java catalogo/src/main/java/com/example/Catalogo_Cursos/infrastructure/output/search/elastic/adapter/
          cp integrations/catalogo-outbox/CourseCreatedEvent.java catalogo/src/main/java/com/example/Catalogo_Cursos/domain/model/course/event/
          cp integrations/catalogo-outbox/Course.java catalogo/src/main/java/com/example/Catalogo_Cursos/domain/model/course/
          cp integrations/backend-security/catalogo/SecurityConfig.java catalogo/src/main/java/com/example/Catalogo_Cursos/infrastructure/config/
          cp integrations/backend-security/catalogo/application-keycloak.yaml catalogo/src/main/resources/
      - name: Compilar Catálogo
        run: cd catalogo && chmod +x mvnw && ./mvnw -B -DskipTests package

  matriculas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clonar Matrículas
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Matricula-Publico_1E.git matricula
      - name: Overlay del adaptador experimental
        run: |
          mkdir -p matricula/src/main/java/com/example/Matricula_Pedidos/integration/web
          cp integrations/matricula-api/*.java matricula/src/main/java/com/example/Matricula_Pedidos/integration/web/
          cp integrations/matricula-api/compat/*.java matricula/src/main/java/com/example/Matricula_Pedidos/domain/model/enrollments/enrollment_students/vo/
      - name: Compilar Matrículas
        run: cd matricula && chmod +x mvnw && ./mvnw -B -DskipTests package

  pagos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clonar Pagos
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Estados_de_Pago.git pagos
      - name: Overlay JWT, dependencias y CORS
        run: |
          mkdir -p pagos/src/main/java/com/example/Servicio_Pago/config
          cp integrations/backend-security/pagos/SecurityConfig.java pagos/src/main/java/com/example/Servicio_Pago/config/
          cp integrations/backend-security/pagos/application-keycloak.properties pagos/src/main/resources/
          python3 - <<'PY'
          from pathlib import Path
          pom=Path('pagos/pom.xml')
          source=pom.read_text()
          for artifact in ('spring-boot-starter-security','spring-boot-starter-oauth2-resource-server'):
            if f'<artifactId>{artifact}</artifactId>' not in source:
              source=source.replace('</dependencies>',f'  <dependency><groupId>org.springframework.boot</groupId><artifactId>{artifact}</artifactId></dependency>\n</dependencies>')
          pom.write_text(source)
          ctrl=Path('pagos/src/main/java/com/example/Servicio_Pago/controller/PagoController.java')
          ctrl.write_text(ctrl.read_text().replace('@CrossOrigin(origins = "*")',''))
          PY
      - name: Compilar Pagos
        run: cd pagos && chmod +x mvnw && ./mvnw -B -DskipTests package
