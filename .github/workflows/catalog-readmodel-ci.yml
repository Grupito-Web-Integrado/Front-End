name: Catalog read-model reconciliation smoke
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - infra/SINCRONIZAR_INDICES.ps1
      - .github/workflows/catalog-readmodel-ci.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone source schema
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Catalogo-Cursos-Publico-1A.git catalogo
      - name: Start PostgreSQL and Elasticsearch
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yml up -d catalogo-db elasticsearch
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:9200 > /dev/null &&
               docker compose --env-file infra/.env -f infra/compose.yml exec -T catalogo-db pg_isready -U admin -d catalog_db; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Create indexes
        run: |
          for path in infra/elastic-indices/*.json; do
            index=$(basename "$path" .json)
            curl -fsS -X PUT "http://localhost:9200/$index" -H 'Content-Type: application/json' --data-binary @"$path"
          done
      - name: Create tables and insert real PostgreSQL fixture
        run: |
          cat catalogo/src/main/resources/db/migration/V1__create_course_catalog.sql | docker compose --env-file infra/.env -f infra/compose.yml exec -T catalogo-db psql -v ON_ERROR_STOP=1 -U admin -d catalog_db
          docker compose --env-file infra/.env -f infra/compose.yml exec -T catalogo-db psql -v ON_ERROR_STOP=1 -U admin -d catalog_db -c "INSERT INTO course_categories(id,name,status) VALUES ('11111111-1111-4111-8111-111111111111','Programación','ACTIVE');"
          docker compose --env-file infra/.env -f infra/compose.yml exec -T catalogo-db psql -v ON_ERROR_STOP=1 -U admin -d catalog_db -c "INSERT INTO courses(id,category_id,code,name,modality,price,currency,start_date,end_date,start_time,duration_hours,capacity,available_slots,status) VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','JAVA-CI','Java CI','ONLINE',99,'PEN','2027-01-01','2027-02-01','09:00',20,20,20,'PUBLISHED');"
      - name: Run Windows-compatible PowerShell read model sync
        shell: pwsh
        run: ./infra/SINCRONIZAR_INDICES.ps1
      - name: Check indexed course and category
        run: |
          curl -fsS http://localhost:9200/courses/_doc/22222222-2222-4222-8222-222222222222 | jq -e '.found == true and ._source.code == "JAVA-CI"'
          curl -fsS http://localhost:9200/course_categories/_doc/11111111-1111-4111-8111-111111111111 | jq -e '.found == true and ._source.status == "ACTIVE"'
      - name: Cleanup disposable containers
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yml down -v || true
