name: E2E navegador - Keycloak y perfiles reales
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - tests/e2e/**
      - .github/workflows/keycloak-browser-ci.yml
  workflow_dispatch:

jobs:
  login-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Credenciales temporales (sin datos de usuarios reales)
        run: |
          python3 - <<'PY'
          import secrets
          with open('infra/.env','w') as f:
            for name in ('CATALOG_DB_PASSWORD','MATRICULA_DB_PASSWORD','KEYCLOAK_DB_PASSWORD','KEYCLOAK_ADMIN_PASSWORD'):
              f.write(name+'='+secrets.token_urlsafe(32)+'\n')
            f.write('KEYCLOAK_ADMIN_USERNAME=admin\n')
          PY
          PW_STUDENT=$(openssl rand -hex 18)
          PW_ADMIN=$(openssl rand -hex 18)
          echo "::add-mask::$PW_STUDENT"
          echo "::add-mask::$PW_ADMIN"
          echo "E2E_STUDENT_PASSWORD=$PW_STUDENT" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$PW_ADMIN" >> "$GITHUB_ENV"
      - name: Arrancar Keycloak real y PostgreSQL efímeros
        run: |
          docker compose --env-file infra/.env -f infra/compose.yml up -d keycloak-db keycloak
          for i in $(seq 1 90); do
            if curl -fsS --max-time 4 http://localhost:8180/realms/myacademy/.well-known/openid-configuration >/dev/null; then
              echo 'Realm Keycloak disponible'
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file infra/.env -f infra/compose.yml logs keycloak --tail=60
          exit 1
      - name: Crear usuarios ESTUDIANTE y ADMIN con roles del realm
        run: |
          set -eu
          set -a; . infra/.env; set +a
          KC="/opt/keycloak/bin/kcadm.sh"
          comp() { docker compose --env-file infra/.env -f infra/compose.yml exec -T keycloak "$KC" "$@"; }
          comp config credentials --server http://localhost:8080 --realm master --user "$KEYCLOAK_ADMIN_USERNAME" --password "$KEYCLOAK_ADMIN_PASSWORD"
          comp create users -r myacademy -s username=e2e_student -s enabled=true -s email=e2e_student@example.invalid -s emailVerified=true
          comp set-password -r myacademy --username e2e_student --new-password "$E2E_STUDENT_PASSWORD"
          comp add-roles -r myacademy --uusername e2e_student --rolename ESTUDIANTE
          comp create users -r myacademy -s username=e2e_admin -s enabled=true -s email=e2e_admin@example.invalid -s emailVerified=true
          comp set-password -r myacademy --username e2e_admin --new-password "$E2E_ADMIN_PASSWORD"
          comp add-roles -r myacademy --uusername e2e_admin --rolename ADMIN
      - name: Instalar frontend y navegador de pruebas
        run: |
          npm ci
          # Aislar las dependencias E2E para evitar el fallo npm edgesOut del proyecto Angular.
          npm install --prefix /tmp/myacademy-e2e-tools --no-audit --no-fund playwright
          google-chrome --version
      - name: Servidores HTTP temporales para aislar los flujos de login
        run: |
          node - <<'NODE' >/tmp/myacademy-api.log 2>&1 &
          const http=require('node:http');
          for(const port of [8080,8081,8082,8084]){
            http.createServer((req,res)=>{
              const url=new URL(req.url,'http://localhost');
              res.setHeader('Content-Type','application/json');
              const page={content:[],totalElements:0,totalPages:0,page:0,size:100};
              if(port===8080 && (url.pathname.startsWith('/api/v1/courses') || url.pathname.startsWith('/api/v1/course-categories'))){
                res.end(JSON.stringify(page));
              } else if(port===8081 && url.pathname.startsWith('/api/pagos')){
                res.end('[]');
              } else if(port===8082 && url.pathname.startsWith('/api/matriculas')){
                res.end('[]');
              } else if(port===8084 && url.pathname==='/actuator/health'){
                res.end(JSON.stringify({status:'UP'}));
              }else{
                res.statusCode=404;res.end(JSON.stringify({error:'not found'}));
              }
            }).listen(port,'127.0.0.1');
          }
          NODE
          sleep 2
      - name: Levantar Angular conectado al Keycloak real
        run: |
          npm start -- --host localhost >/tmp/myacademy-angular.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://localhost:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/myacademy-angular.log
          exit 1
      - name: Validar login E2E de ambos perfiles y guardas
        run: node tests/e2e/keycloak-login.mjs
      - name: Diagnósticos si fallan las pruebas
        if: failure()
        run: |
          tail -140 /tmp/myacademy-angular.log 2>/dev/null || true
          docker compose --env-file infra/.env -f infra/compose.yml logs keycloak --tail=80 || true
      - name: Eliminar infraestructura y cuentas efímeras
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yml down -v || true
