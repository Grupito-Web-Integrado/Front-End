name: Comprobar contrato con Indexer Joker (solo lectura)
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - proxy.conf.json
      - src/app/core/academia-api.service.ts
      - .github/workflows/joker-indexer-compat-ci.yml
  workflow_dispatch:
jobs:
  read-only-indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clonar repositorio Joker sin modificaciones
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Catalog-Indexer-.git joker-indexer
      - name: Comprobar topics y esquema de lectura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('joker-indexer/src/main/java/com/example/Catalogo_Cursos_Indexer')
          expected={
            'CourseConsumer.java':'catalog.COURSE.events',
            'CourseCategoryConsumer.java':'catalog.COURSE_CATEGORY.events',
            'CourseScheduleConsumer.java':'catalog.COURSE_SCHEDULE.events',
            'CourseLocationConsumer.java':'catalog.COURSE_LOCATION.events'
          }
          for name,topic in expected.items():
            content=(source/'consumer'/name).read_text()
            assert topic in content,(name,topic)
          doc=(source/'document/CourseDocument.java').read_text()
          for field in ('courseId','courseCategoryId','nameSuggest','imageKey','categories','schedules','locations'):
            assert field in doc,field
          front=Path('src/app/core/academia-api.service.ts').read_text()
          assert "'/api/indexer/health'" in front
          assert 'courses/published' in front
          print('Contrato de temas Kafka, campos Elasticsearch y proxy verificado.')
          PY
      - name: Compilar Indexer de Joker SIN modificar su fuente
        run: |
          cd joker-indexer
          chmod +x mvnw
          ./mvnw -B -DskipTests package
