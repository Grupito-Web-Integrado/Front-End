name: Angular Vite proxy end-to-end smoke
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - proxy.conf.json
      - package.json
      - package-lock.json
      - .github/workflows/proxy-routing-ci.yml
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Start disposable HTTP endpoints with expected upstream ports
        run: |
          node - <<'JS' > /tmp/myacademy-backend-stubs.log 2>&1 &
          const http=require('node:http');
          for (const port of [8080,8081,8082,8084]) {
            http.createServer((req,res)=>{
              res.writeHead(200,{'content-type':'application/json'});
              res.end(JSON.stringify({port,path:req.url}));
            }).listen(port,'127.0.0.1');
          }
          JS
          sleep 1
      - name: Start Angular development server
        run: |
          npm start > /tmp/myacademy-ng.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:4200/inicio >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -120 /tmp/myacademy-ng.log
          exit 1
      - name: Test nested routes and queries through Vite proxy
        run: |
          set -eu
          curl -fsS 'http://127.0.0.1:4200/api/v1/courses/published?page=0&size=10' | jq -e '.port == 8080 and (.path | startswith("/api/v1/courses/published"))'
          curl -fsS 'http://127.0.0.1:4200/api/pagos/42' | jq -e '.port == 8081 and .path == "/api/pagos/42"'
          curl -fsS 'http://127.0.0.1:4200/api/matriculas/admin' | jq -e '.port == 8082 and .path == "/api/matriculas/admin"'
          curl -fsS 'http://127.0.0.1:4200/api/indexer/health' | jq -e '.port == 8084 and .path == "/actuator/health"'
      - name: Show server logs if failing
        if: failure()
        run: tail -100 /tmp/myacademy-ng.log || true
