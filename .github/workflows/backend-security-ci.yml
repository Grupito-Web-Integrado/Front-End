name: Validar adaptaciones Keycloak en Java
on:
  push:
    branches: [feat/dwi-frontend-gonzalo]
    paths:
      - integrations/backend-security/**
      - .github/workflows/backend-security-ci.yml
  workflow_dispatch:

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone catalogo
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Catalogo-Cursos-Publico-1A.git catalogo
      - name: Apply security adapter without modifying upstream
        run: |
          cp integrations/backend-security/catalogo/SecurityConfig.java catalogo/src/main/java/com/example/Catalogo_Cursos/infrastructure/config/SecurityConfig.java
          cp integrations/backend-security/catalogo/application-keycloak.yaml catalogo/src/main/resources/application-keycloak.yaml
      - name: Compile catalogo
        run: |
          cd catalogo
          chmod +x mvnw
          ./mvnw -B -DskipTests package

  pagos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone pagos
        run: git clone --depth 1 https://github.com/Grupito-Web-Integrado/Estados_de_Pago.git pagos
      - name: Apply security adapter without modifying upstream
        run: |
          mkdir -p pagos/src/main/java/com/example/Servicio_Pago/config
          cp integrations/backend-security/pagos/SecurityConfig.java pagos/src/main/java/com/example/Servicio_Pago/config/SecurityConfig.java
          cp integrations/backend-security/pagos/application-keycloak.properties pagos/src/main/resources/application-keycloak.properties
          python3 - <<'PY'
          from pathlib import Path
          pom=Path('pagos/pom.xml')
          text=pom.read_text()
          for dep in ('spring-boot-starter-security','spring-boot-starter-oauth2-resource-server'):
              if f'<artifactId>{dep}</artifactId>' not in text:
                  insert=f'        <dependency>\n            <groupId>org.springframework.boot</groupId>\n            <artifactId>{dep}</artifactId>\n        </dependency>\n'
                  text=text.replace('</dependencies>',insert+'    </dependencies>')
          pom.write_text(text)
          controller=Path('pagos/src/main/java/com/example/Servicio_Pago/controller/PagoController.java')
          controller.write_text(controller.read_text().replace('@CrossOrigin(origins = "*")',''))
          PY
      - name: Compile pagos
        run: |
          cd pagos
          chmod +x mvnw
          ./mvnw -B -DskipTests package
