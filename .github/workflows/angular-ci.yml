name: Angular frontend CI
on:
  push:
    branches:
      - feat/dwi-frontend-gonzalo
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:smoke
      - run: npx ng test --watch=false --include=src/app/core/academia-api.service.spec.ts
      - run: npm run build
      - name: Validate Docker Compose
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yml config --quiet
