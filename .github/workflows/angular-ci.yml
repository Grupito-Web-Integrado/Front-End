name: Angular frontend CI
on:
  push:
    branches:
      - feat/dwi-frontend-gonzalo
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:smoke
      - run: npx ng test --watch=false --include=src/app/core/academia-api.service.spec.ts
      - run: npx ng test --watch=false --include=src/app/features/portal-estudiante/portal-estudiante.spec.ts
      - run: npx ng test --watch=false --include=src/app/features/portal-admin/portal-admin.spec.ts
      - run: npx ng test --watch=false --include=src/app/core/identity.guard.spec.ts
      - run: npm run build
      - name: Adjuntar compilación para visualización local
        uses: actions/upload-artifact@v4
        with:
          name: myacademy-angular-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem infra -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$issues) | Out-Null
            if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Error "$($_.Message) [$($_.Extent.File):$($_.Extent.StartLineNumber)]" }
              exit 1
            }
          }
      - name: Validate Docker Compose
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yml config --quiet
