# Infraestructura local de MyAcademy (no usar en producción).
# Servicios de aplicación Java se ejecutan desde sus propios repositorios.
name: myacademy-infra

services:
  catalogo-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Ejecuta INICIAR_INFRA.ps1}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 8

  matricula-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: matricula_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${MATRICULA_DB_PASSWORD:?Ejecuta INICIAR_INFRA.ps1}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - matricula_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d matricula_db"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ejecuta INICIAR_INFRA.ps1}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 8

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ejecuta INICIAR_INFRA.ps1}
      KC_HOSTNAME: "http://localhost:8180"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Ejecuta INICIAR_INFRA.ps1}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/myacademy-realm.json:/opt/keycloak/data/import/myacademy-realm.json:ro

  jaeger:
    profiles: ["observabilidad"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  catalogo_data:
  matricula_data:
  redis_data:
  elasticsearch_data:
  keycloak_data:
