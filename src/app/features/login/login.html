<div class="page-login">
  <div class="panel">
    <div class="brand">
      <h1>MyAcademy</h1>
      <p class="tag">Premium learning platform</p>
    </div>

    <form (submit)="submit($event)">
      <label>Usuario</label>
      <input type="text" [(ngModel)]="username" name="username" placeholder="tu.usuario" />

      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="********" />

      <div class="actions">
        <button type="submit">Entrar</button>
      </div>

      <p class="muted">Inicia sesión con Keycloak en producción. Este es un login local de ejemplo.</p>
    </form>
  </div>
</div>
